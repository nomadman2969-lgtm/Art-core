name: CI

on:
  push:
    branches: [_abcmain, main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Syntax check only — needs no dependencies, so it can't break on the
      # Emergent-hosted wheels (litellm, emergentintegrations) in requirements.txt.
      - name: Compile check
        run: python -m compileall -q backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No yarn.lock is committed (Emergent exports without it), so no
      # lockfile cache or --frozen-lockfile.
      - name: Install
        working-directory: frontend
        run: yarn install --network-timeout 300000
      - name: Build
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: https://example.com
          CI: "false"
        run: yarn build
